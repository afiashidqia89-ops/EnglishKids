<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hafalan Juz Amma</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:ui-rounded,"Nunito",system-ui,sans-serif;background:linear-gradient(#d6f1e4,#fff 55%);color:#2b2d42;min-height:100vh;overflow-x:hidden;user-select:none}
#app{max-width:520px;margin:auto;padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(18px,env(safe-area-inset-bottom))}
button{font:inherit;border:0;cursor:pointer;color:inherit}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{background:#fff;border-radius:99px;padding:8px 14px;font-weight:800;box-shadow:0 3px 0 #cde}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.card{border-radius:26px;padding:12px 8px;color:#fff;font-weight:800;font-size:16px;box-shadow:0 6px 0 rgba(0,0,0,.2);transition:transform .08s}
.card:active{transform:translateY(5px);box-shadow:none}
.card b{display:block;font-size:46px;animation:bob 2.4s ease-in-out infinite}
.card:nth-child(even) b{animation-delay:-1.2s}
.card small{display:block;font-weight:700;opacity:.9}
.prog{height:8px;border-radius:9px;background:rgba(255,255,255,.4);margin:6px 10px 0;overflow:hidden}.prog i{display:block;height:100%;background:#fff}
@keyframes bob{50%{transform:translateY(-7px) rotate(-6deg)}}
.mascot{font-size:84px;text-align:center;animation:bob 1.8s ease-in-out infinite}
.box{background:#fff;border-radius:26px;padding:16px;margin-top:10px;font-size:18px;line-height:1.5;box-shadow:0 5px 0 #cde}
.ar{font-size:30px;line-height:2.2;text-align:right;direction:rtl;font-family:"Noto Naskh Arabic","Amiri","Traditional Arabic",serif}
.lt{color:#6b5bd2;font-style:italic;font-size:16px;margin-top:4px}.tr{color:#555;font-size:16px;margin-top:6px}
.num{display:inline-block;width:32px;height:32px;border-radius:50%;background:#2fa36b;color:#fff;text-align:center;line-height:32px;font-weight:800;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1;padding:10px 4px;border-radius:16px;background:#fff;font-weight:800;box-shadow:0 3px 0 #cde}.tabs .on{background:#2fa36b;color:#fff}
.go{display:block;width:100%;background:#2fa36b;color:#fff;border-radius:22px;padding:15px;font-size:20px;font-weight:800;box-shadow:0 5px 0 #1f7a4f;margin-top:12px}
.tk{display:inline-block;padding:8px 14px;margin:4px;border-radius:14px;background:#ffc93c;font-size:26px;font-family:"Noto Naskh Arabic","Amiri",serif;box-shadow:0 3px 0 #d9a400}
.hl{outline:4px solid #ffc93c}.ok{animation:pop .45s}.no{animation:shake .4s}
@keyframes pop{50%{transform:scale(1.06)}}@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.fall{position:fixed;top:-50px;font-size:30px;animation:fall 3s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
#tt{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2b2d42;color:#fff;padding:10px 16px;border-radius:14px;display:none;z-index:9}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div id="app"></div><div id="tt"></div>
<script src="data.js"></script><script src="quran.js" onerror="window.QURAN=null"></script>
<script>
const $=id=>document.getElementById(id),h=x=>$('app').innerHTML=x,Q=(window.QURAN||{}).s||{},HB=(window.QURAN||{}).b;
const AN=['🐰','🦁','🐯','🐻','🐼','🐨','🐵','🦊','🐸','🦒','🦓','🐧','🐢','🐬','🦜','🦉','🦋','🐝','🐞','🦀','🐙','🐳','🐴','🦈','🐊','🦘','🐿️','🐘','🦔','🐮','🐑','🐐','🦆','🐓','🦩','🐪','🦌'];
const COL=['#2fa36b','#4f9dff','#e0883a','#8e6bff','#e0457b','#1f9d8f'];
let save=JSON.parse(localStorage.getItem('jz')||'{"st":{},"stars":0}'),mute=false,rate=1,showL=true,showT=true,desc=true,AC,cur={},reps={};
const put=()=>localStorage.setItem('jz',JSON.stringify(save)),st=(n,i)=>save.st[n+':'+i]||0,set=(n,i,v)=>{save.st[n+':'+i]=v;put()},star=k=>{save.stars+=k;put()};
const done=m=>{let c=0,a=0;for(let i=0;i<m[3];i++){const v=st(m[0],i);if(v==2)c++;if(v>0)a++}return[c,a]};
const toast=m=>{$('tt').textContent=m;$('tt').style.display='block';setTimeout(()=>$('tt').style.display='none',2600)};
// suara efek (WebAudio)
function tone(f,t,d,y){try{if(mute)return;AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t;o.type=y||'sine';o.frequency.value=f;g.gain.setValueAtTime(.16,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)}catch(e){}}
const snd={tap:()=>tone(560,0,.08),ok:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.2,'triangle')),no:()=>{tone(300,0,.15);tone(220,.13,.3)},win:()=>[523,659,784,659,784,1047].forEach((f,i)=>tone(f,i*.13,.28,'triangle'))};
// audio ayat: file lokal (hasil build) atau streaming
const AU=new Audio(),code=(n,a)=>String(n).padStart(3,'0')+String(a).padStart(3,'0');
function play(n,a,end){AU.pause();const loc=n==1?HB:(Q[n]&&Q[n][a-1]||{}).a;AU.src=(loc?'audio/':'https://everyayah.com/data/Alafasy_64kbps/')+code(n,a)+'.mp3';AU.playbackRate=rate;AU.onended=end||null;AU.onerror=()=>toast('Audio belum bisa diputar. Cek internet.');AU.play().catch(()=>{})}
function confetti(){const E=['🎉','⭐','🐾','🎈'];for(let i=0;i<24;i++){const e=document.createElement('div');e.className='fall';e.textContent=E[i%4];e.style.left=Math.random()*94+'vw';e.style.animationDelay=Math.random()+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),4500)}}
// beranda
function home(){AU.pause();const tot=SUR.reduce((s,m)=>s+done(m)[0],0),L=SUR.slice().sort((a,b)=>desc?b[0]-a[0]:a[0]-b[0]);
h(`<div class=bar><span class=pill>⭐ ${save.stars}</span><b style="font-size:21px">Hafalan Juz Amma</b><button class=pill onclick="mute=!mute;home()">${mute?'🔇':'🔊'}</button></div>
<div class=mascot>🐰</div><p style="text-align:center;font-weight:800;margin:0">Halo! Ayo menetaskan telur hewan dengan hafalanmu 🥚➡️🐣</p>
<p style="text-align:center;margin:4px 0">Sudah hafal: <b>${tot}</b> dari 37 surah <button class=pill onclick="desc=!desc;home()">${desc?'Mulai dari An-Nas':'Urut mushaf'} 🔁</button></p>
<div class=grid>${L.map(m=>{const[c,a]=done(m),ic=c==m[3]?AN[m[0]-78]:a?'🐣':'🥚';return`<button class=card style="background:${COL[m[0]%6]}" onclick="snd.tap();sur(${m[0]},'baca')"><b>${ic}</b>${m[1]}<small>${m[2]}</small><small>${c}/${m[3]} ayat</small><div class=prog><i style="width:${c/m[3]*100}%"></i></div></button>`}).join('')}</div>`)}
// halaman surah
function sur(n,mode){cur={n,mode,i:0};reps={};draw()}
function top(){const m=SUR.find(x=>x[0]==cur.n),T=[['baca','📖 Baca'],['hafal','🧠 Hafal'],['susun','🧩 Susun']];
return`<div class=bar><button class=pill onclick="home()">⬅️</button><b style="font-size:19px">${m[1]}</b><button class=pill onclick="rate=rate==1?.75:1;toast(rate==1?'Kecepatan normal 🐇':'Pelan 🐢');draw()">${rate==1?'🐇':'🐢'}</button></div><div class=tabs>${T.map(t=>`<button class="${cur.mode==t[0]?'on':''}" onclick="snd.tap();sur(${cur.n},'${t[0]}')">${t[1]}</button>`).join('')}</div>`}
function draw(){AU.pause();if(!Q[cur.n]){h(`<div class=bar><button class=pill onclick="home()">⬅️</button></div><div class=box>Data ayat belum ada. Build lewat GitHub Actions akan mengunduhnya otomatis.</div>`);return}({baca,hafal,susun})[cur.mode]()}
const dots=i=>'●'.repeat(reps[i]||0)+'○'.repeat(3-(reps[i]||0));
function baca(){const n=cur.n,ay=Q[n];
h(top()+`<div class=bar><button class=pill onclick="showL=!showL;draw()">Latin ${showL?'✅':'⬜'}</button><button class=pill onclick="showT=!showT;draw()">Arti ${showT?'✅':'⬜'}</button><button class=pill onclick="snd.tap();play(1,1,()=>all(0))">▶️ Putar semua</button></div>
<div class=box style="text-align:center">Bismillahirrahmanirrahim <button class=pill onclick="play(1,1)">🔊</button></div>
${ay.map((x,i)=>`<div class=box id=a${i}><div class=row><span class=num>${i+1}</span><span id=s${i}>${['','🌱','✅'][st(n,i)]}</span></div><div class=ar>${x.t}</div>${showL?`<div class=lt>${x.l}</div>`:''}${showT?`<div class=tr>${x.i}</div>`:''}
<div class=row><button class=pill onclick="once(${i})">▶️ Dengar</button><span id=r${i} style="font-size:20px">${dots(i)}</span><small>dengar 3x 🌱</small></div></div>`).join('')}`)}
function once(i){const n=cur.n;play(n,i+1,()=>{reps[i]=Math.min(3,(reps[i]||0)+1);$('r'+i).textContent=dots(i);if(reps[i]==3&&st(n,i)<1){set(n,i,1);star(1);snd.ok();$('s'+i).textContent='🌱'}})}
function all(k){const ay=Q[cur.n];document.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));if(!ay||k>=ay.length){snd.win();return}const e=$('a'+k);if(!e)return;e.classList.add('hl');e.scrollIntoView({behavior:'smooth',block:'center'});play(cur.n,k+1,()=>all(k+1))}
// mode hafalan: dengar, ucapkan dari ingatan, lalu cek
function hafal(){const n=cur.n,ay=Q[n],i=cur.i;if(i>=ay.length)return fin();const x=ay[i];
h(top()+`<div class=bar><span class=pill>Ayat ${i+1}/${ay.length}</span></div><div class=mascot>${AN[n-78]}</div><div class=box id=cv style="text-align:center">Dengarkan, lalu ucapkan dari ingatanmu!<div class=ar style="text-align:center">${x.t.split(' ')[0]} …</div></div>
<button class=go onclick="play(${n},${i+1})">🎧 Dengar ayat</button><button class=go style="background:#8e6bff;box-shadow:0 5px 0 #5b3fd0" onclick="reveal()">👀 Lihat ayat</button><div id=rt></div>`)}
function reveal(){const x=Q[cur.n][cur.i];$('cv').innerHTML=`<div class=ar style="text-align:center">${x.t}</div><div class=lt>${x.l}</div>`;$('rt').innerHTML=`<button class=go onclick="grade(2)">😀 Lancar!</button><button class=go style="background:#e0883a;box-shadow:0 5px 0 #a8621f" onclick="grade(1)">🤔 Masih belajar</button>`}
function grade(v){const n=cur.n,i=cur.i;if(v==2){set(n,i,2);star(2);snd.ok()}else{if(st(n,i)<1)set(n,i,1);snd.tap()}cur.i++;hafal()}
function fin(){const m=SUR.find(x=>x[0]==cur.n),[c]=done(m),all2=c==m[3];if(all2){snd.win();confetti()}
h(top()+`<div class=mascot>${all2?AN[cur.n-78]:'🐣'}</div><div class=box style="text-align:center"><h2 style="margin:0">${all2?'Masya Allah! Telur menetas! 🎉':'Bagus sekali!'}</h2>Hafal ${c} dari ${m[3]} ayat</div><button class=go onclick="sur(${cur.n},'hafal')">🔁 Ulangi</button><button class=go style="background:#4f9dff;box-shadow:0 5px 0 #2a6fd0" onclick="home()">🏠 Beranda</button>`)}
// mode susun kata
function susun(){const n=cur.n,ay=Q[n];let i=cur.i;const ok=j=>{const l=ay[j].t.split(' ').length;return l>=2&&l<=8};while(i<ay.length&&!ok(i))i++;cur.i=i;
if(i>=ay.length){h(top()+`<div class=box style="text-align:center">Selesai! 🎉<br>Coba mode 🧠 Hafal untuk ayat yang panjang.</div>`);return}
cur.w=ay[i].t.split(' ');cur.sel=[];cur.tk=cur.w.map((_,j)=>j).sort(()=>Math.random()-.5);sp()}
function sp(){const n=cur.n,i=cur.i;h(top()+`<div class=bar><span class=pill>Ayat ${i+1}</span><button class=pill onclick="play(${n},${i+1})">🎧 Dengar</button></div><div class=box id=bx style="text-align:center">Susun kata sesuai bacaan!<div class=ar id=sl style="min-height:70px">${cur.sel.map(j=>`<span class=tk>${cur.w[j]}</span>`).join('')}</div></div>
<div class=box style="direction:rtl;text-align:center">${cur.tk.filter(j=>!cur.sel.includes(j)).map(j=>`<span class=tk onclick="tk(${j})">${cur.w[j]}</span>`).join('')}</div><div id=rt></div>`)}
function tk(j){cur.sel.push(j);snd.tap();sp();if(cur.sel.length<cur.w.length)return;const n=cur.n,i=cur.i;
if(cur.sel.map(k=>cur.w[k]).join(' ')==cur.w.join(' ')){snd.ok();star(1);if(st(n,i)<1)set(n,i,1);$('bx').classList.add('ok');play(n,i+1);$('rt').innerHTML=`<button class=go onclick="cur.i++;susun()">Lanjut ➡️</button>`}
else{snd.no();$('bx').classList.add('no');setTimeout(()=>{cur.sel=[];sp()},700)}}
home();
</script></body></html>
