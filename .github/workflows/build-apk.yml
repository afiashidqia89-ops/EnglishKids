name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: >
          gradle assembleDebug --no-daemon
          -PCONTENT_BASE_URL=https://raw.githubusercontent.com/${{ github.repository }}/main/content/
          -PAI_PROXY_URL=${{ vars.AI_PROXY_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: MimoEnglish-debug-apk
          path: app/build/outputs/apk/debug/*.apk
